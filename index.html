<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f5f8f">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>LocalWriter</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#3f5f8f;--ln:#e3e6ee;--sel:#dfe8fb;--ok:#2e8b57;--no:#c0702a;--fs:18px;--lh:1.6;--ff:Georgia,serif}
[data-t=dark]{--bg:#12151c;--card:#1b2029;--tx:#e6e9f0;--mu:#8e97aa;--ac:#6f93cf;--ln:#2a313e;--sel:#26344d;--ok:#5cc08a;--no:#e0a060}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;overflow:hidden}
h1{margin:0;font-size:24px}b{font-weight:650}
.mu{color:var(--mu);font-size:13px}.cap{margin:16px 2px 8px;font-size:12px}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}
#app{flex:1;position:relative;min-height:0}
.scr{display:none;position:absolute;inset:0;flex-direction:column;background:var(--bg)}.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--card);border-bottom:1px solid var(--ln)}
.pad{padding:14px;overflow:auto;flex:1}
.ib{background:0;border:0;color:var(--tx);font-size:20px;width:40px;height:40px;border-radius:10px;flex:none}
.ib:active{background:var(--sel)}
.btn{display:block;width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:15px;margin-top:8px}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.dn{color:#c0392b}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
.in{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px}
.th{width:64px;height:64px;border-radius:10px;flex:none;color:#ffffffcc;display:grid;place-items:center;font:700 26px Georgia,serif}
#nav{display:none;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:0;border:0;color:var(--mu);padding:11px 0;font-size:13px}
#nav button.a{color:var(--ac);font-weight:700}
.crow{padding:12px;border-radius:10px;margin-bottom:2px;border-left:4px solid transparent}.crow.cur{background:var(--sel);border-color:var(--ac)}
#cq{display:none;margin:8px 0}#cq.on{display:block}
#ct{border:0;outline:0;background:transparent;color:var(--tx);font:700 26px var(--ff);padding:16px 20px 4px;width:100%}
#ta{flex:1;width:100%;min-height:0;border:0;outline:0;resize:none;background:transparent;color:var(--tx);font:var(--fs)/var(--lh) var(--ff);padding:8px 20px 20px}
.ft{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--mu);border-top:1px solid var(--ln);background:var(--card)}
#st.ok{color:var(--ok)}#st.no{color:var(--no)}
.tb{display:flex;align-items:center;justify-content:space-around;background:var(--card);border-top:1px solid var(--ln);padding:2px 4px calc(env(safe-area-inset-bottom) + 2px)}
.tb button{background:0;border:0;color:var(--tx);font-size:18px;width:42px;height:42px;border-radius:10px}.tb button.a{background:var(--sel)}
.fx{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:8px;color:var(--mu)}
#ed.focus .hd,#ed.focus .tb{display:none}#ed.focus .fx{display:block}#ed.focus #ct{padding-top:calc(env(safe-area-inset-top) + 48px)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90dvh;overflow:auto}
#set{display:none}#set.on{display:flex}
.sh label,.sh .l{display:block;margin-top:14px;font-size:13px;color:var(--mu)}
.sh select{width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:15px}
.sh input[type=range]{width:100%;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:14px}
.seg button.a{background:var(--sel);border-color:var(--ac);color:var(--ac)}
#fr,#nt{display:none}#fr.on,#nt.on{display:flex}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20}
</style></head><body>
<div id="app">
<section class="scr" id="lib"><div class="hd"><div class="grow"><h1>Pustaka Anda</h1><div class="mu">Kelola proyek tulisan Anda</div></div><button class="ib" id="gs">⚙</button></div>
<div class="pad"><div class="card" id="rm" style="display:none"></div><input id="q" class="in" placeholder="Cari novel..." oninput="renderLib()"><div class="mu cap">Terbaru</div><div id="plist"></div><button class="btn pri" id="np">+ Proyek Baru</button></div></section>

<section class="scr" id="files"><div class="hd"><div class="grow"><h1>Berkas &amp; Cadangan</h1><div class="mu">Kelola berkas dan buat cadangan</div></div></div>
<div class="pad"><div class="mu cap">Penyimpanan lokal</div><div id="flist"></div><div class="mu cap">Cadangan</div>
<button class="btn" id="ea"><b>Ekspor Semua Proyek</b><div class="mu">Simpan semua novel sebagai file ZIP</div></button>
<button class="btn" id="ia"><b>Impor ZIP Cadangan</b><div class="mu">Pulihkan proyek dari ZIP (satu folder = satu proyek)</div></button>
<input type="file" id="imp" accept=".zip,application/zip" hidden><p class="mu" id="use"></p><p class="mu" id="pst"></p><p class="mu" id="lb"></p></div></section>

<section class="scr" id="chap"><div class="hd"><button class="ib" id="cb">←</button><h1 class="grow" style="font-size:20px">Daftar Bab</h1><button class="ib" id="cs">⌕</button><button class="ib" id="ca">＋</button></div>
<div class="pad"><input id="cq" class="in" placeholder="Cari bab..." oninput="renderCh()"><div class="card row"><div class="grow"><b id="ptit"></b><div class="mu" id="pn"></div></div></div><div id="clist"></div><button class="btn" id="ro">Urutkan Bab</button><button class="btn" id="cf">Cari &amp; Ganti</button><button class="btn" id="cn2">Catatan Proyek</button></div></section>

<section class="scr" id="ed"><div class="hd"><button class="ib" id="eb">←</button><div class="grow" id="hd"><b id="h1"></b><div class="mu" id="h2"></div></div><button class="ib" id="fb">⛶</button></div>
<button class="ib fx" id="xf">✕</button>
<input id="ct" maxlength="120" placeholder="Judul bab" autocomplete="off">
<textarea id="ta" placeholder="Mulai menulis..."></textarea>
<div class="ft"><span id="cn"></span><span id="st"></span></div>
<div class="tb"><button id="un">↶</button><button id="re">↷</button><button data-a="left">⬱</button><button data-a="center">≡</button><button data-a="right">⬳</button><button data-a="justify">☰</button><button id="hi">◷</button><button id="aa">Aa</button></div></section>
</div>
<div id="nav"><button data-s="lib">Pustaka</button><button data-s="files">Berkas &amp; Cadangan</button></div>

<div class="ov" id="fr"><div class="sh"><div class="row"><b class="grow">Cari &amp; Ganti</b><button class="ib" id="fx2">✕</button></div>
<input id="ff" class="in" placeholder="Cari..." style="margin-top:12px"><input id="fp" class="in" placeholder="Ganti dengan..." style="margin-top:8px">
<label><input type="checkbox" id="fc"> Huruf besar/kecil harus sama</label>
<div id="frr" class="mu" style="margin:10px 0;max-height:30dvh;overflow:auto;white-space:pre-line"></div>
<div class="row"><button class="btn" id="fg">Cari</button><button class="btn pri" id="fa">Ganti Semua</button></div></div></div>
<div class="ov" id="nt"><div class="sh"><div class="row"><b class="grow">Catatan Proyek</b><button class="ib" id="nx">✕</button></div><div class="mu">Tokoh, dunia cerita, alur. Tidak masuk hitungan bab.</div>
<textarea id="nta" class="in" style="height:50dvh;margin-top:10px;font:15px/1.5 system-ui,sans-serif;resize:none"></textarea></div></div>
<div class="ov" id="set"><div class="sh"><div class="row"><b class="grow">Pengaturan Teks</b><button class="ib" id="sx">✕</button></div>
<label>Jenis Huruf<select id="sf"><option value="serif">Georgia (serif)</option><option value="book">Palatino</option><option value="sans">Sans-serif</option><option value="mono">Monospace</option></select></label>
<label>Ukuran Huruf<select id="ss"></select></label>
<label>Jarak Baris: <span id="slv"></span><input type="range" id="sl" min="1.2" max="2.2" step=".1"></label>
<div class="l">Perataan Teks</div><div class="seg"><button data-a="left">Kiri</button><button data-a="center">Tengah</button><button data-a="right">Kanan</button><button data-a="justify">Rata</button></div>
<div class="l">Tema</div><div class="seg"><button data-th="light">Terang</button><button data-th="dark">Gelap</button><button data-th="system">Sistem</button></div>
<div class="row" style="margin-top:16px"><button class="btn" id="sr">Atur Ulang</button><button class="btn pri" id="sd">Selesai</button></div></div></div>

<script>
const FF={serif:'Georgia,"Times New Roman",serif',book:'Palatino,"Palatino Linotype","Book Antiqua",serif',sans:'system-ui,-apple-system,sans-serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const DEF={ff:'serif',fs:18,lh:1.6,al:'left',th:'system'};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),fmt=n=>n.toLocaleString('id-ID');
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const safe=s=>s.replace(/[\\/:*?"<>|]/g,'-').trim()||'tanpa-judul',pad=n=>String(n).padStart(2,'0');
let db,P,C,chs=[],dirty=false,timer,cnt,reord=false,rmHide=false,cfg={...DEF};

/* ===== IndexedDB ===== */
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('localwriter',2);r.onupgradeneeded=()=>{const d=r.result,n=d.objectStoreNames;if(!n.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!n.contains('chapters'))d.createObjectStore('chapters',{keyPath:'id'}).createIndex('pid','pid');if(!n.contains('texts'))d.createObjectStore('texts',{keyPath:'id'});if(!n.contains('settings'))d.createObjectStore('settings',{keyPath:'k'});if(!n.contains('versions'))d.createObjectStore('versions',{keyPath:'id'}).createIndex('cid','cid')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(st,m,f)=>new Promise((ok,no)=>{const t=db.transaction(st,m),r=f(...[].concat(st).map(s=>t.objectStore(s)));t.oncomplete=()=>ok(Array.isArray(r)?r.map(x=>x.result):r&&r.result);t.onerror=t.onabort=()=>no(t.error)});
const put=(s,o)=>tx(s,'readwrite',x=>{x.put(o)});
const chapsOf=id=>tx('chapters','readonly',s=>s.index('pid').getAll(id)).then(a=>a.sort((x,y)=>x.o-y.o));

/* ===== Hitung kata & karakter ===== */
function stats(t){return[(t.match(/\S+/g)||[]).length,t.replace(/[\r\n]/g,'').length-(t.match(/[\uD800-\uDBFF]/g)||[]).length,t.split('\n').filter(x=>x.trim()).length]}
function count(){const[w,c,p]=stats($('#ta').value);$('#cn').textContent=`${fmt(w)} kata • ${fmt(c)} karakter • ${p} paragraf`}

/* ===== ZIP (tanpa library, mode simpan) ===== */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=d=>{let c=-1;for(let i=0;i<d.length;i++)c=CT[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(fs){const te=new TextEncoder(),parts=[],cd=[],n=new Date();let off=0;
const dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tt=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);
for(const f of fs){const nm=te.encode(f.name),d=te.encode(f.text),cr=crc(d);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,tt,true);h.setUint16(12,dt,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(12,tt,true);c.setUint16(14,dt,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
parts.push(h,nm,d);cd.push(c,nm);off+=30+nm.length+d.length}
let cs=0;for(const x of cd)cs+=x.byteLength;
const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,fs.length,true);e.setUint16(10,fs.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
return new Blob([...parts,...cd,e],{type:'application/zip'})}
async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf),td=new TextDecoder(),out=[];let e=u.length-22;
while(e>=0&&v.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw 0;
const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
for(let i=0;i<n;i++){const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),kl=v.getUint16(p+32,true),o=v.getUint32(p+42,true),name=td.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+kl;
if(name.endsWith('/'))continue;const s=o+30+v.getUint16(o+26,true)+v.getUint16(o+28,true);let d=u.subarray(s,s+cs);
if(m==8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(m)continue;
out.push({name,text:td.decode(d)})}return out}

/* ===== UI util ===== */
function sheet(t,items){const o=E('div','ov'),s=E('div','sh');s.append(E('b','',t));for(const[l,f,d]of items){const b=E('button','btn'+(d?' dn':''),l);b.onclick=()=>{o.remove();f()};s.append(b)}const c=E('button','btn','Batal');c.onclick=()=>o.remove();s.append(c);o.onclick=e=>{if(e.target==o)o.remove()};o.append(s);document.body.append(o)}
function toast(m){const t=E('div','toast',m);document.body.append(t);setTimeout(()=>t.remove(),2200)}
function ask(t,v){return new Promise(r=>{const o=E('div','ov'),s=E('div','sh'),i=E('input','in'),w=E('div','row'),c=E('button','btn','Batal'),k=E('button','btn pri','OK'),end=x=>{o.remove();r(x)};i.value=v||'';i.style.marginTop='12px';c.onclick=()=>end(null);k.onclick=()=>end(i.value);i.onkeydown=e=>{if(e.key=='Enter')end(i.value)};w.append(c,k);s.append(E('b','',t),i,w);o.append(s);document.body.append(o);i.focus();i.select()})}
function yes(m,l){return new Promise(r=>{const o=E('div','ov'),s=E('div','sh'),w=E('div','row'),c=E('button','btn','Batal'),k=E('button','btn'+(l?' pri':' dn'),l||'Hapus'),end=x=>{o.remove();r(x)};c.onclick=()=>end(false);k.onclick=()=>end(true);w.append(c,k);s.append(E('p','',m),w);o.append(s);document.body.append(o)})}
function show(id){$$('.scr').forEach(e=>e.classList.toggle('on',e.id==id));$('#nav').style.display=id=='lib'||id=='files'?'flex':'none';$$('#nav button').forEach(b=>b.classList.toggle('a',b.dataset.s==id));if(id=='lib')renderLib();if(id=='files')renderFiles()}
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'baru saja':m<60?Math.floor(m)+' menit lalu':m<1440?Math.floor(m/60)+' jam lalu':Math.floor(m/1440)+' hari lalu'};
const grad=t=>{const h=Math.abs([...t].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;return`linear-gradient(135deg,hsl(${h} 45% 42%),hsl(${(h+50)%360} 50% 24%))`};

/* ===== Pustaka ===== */
async function renderLib(){remind();const q=$('#q').value.toLowerCase(),l=(await tx('projects','readonly',s=>s.getAll())).sort((a,b)=>b.u-a.u).filter(p=>p.t.toLowerCase().includes(q)),box=$('#plist');box.replaceChildren();
if(!l.length)box.append(E('p','mu','Belum ada proyek. Ketuk "Proyek Baru" untuk mulai menulis.'));
for(const p of l){const r=E('div','card row'),th=E('div','th',p.t[0].toUpperCase()),b=E('div','grow');th.style.background=grad(p.t);b.append(E('b','',p.t),E('div','mu',p.n+' bab'),E('div','mu','Diubah '+ago(p.u)));
const m=E('button','ib','⋮');m.onclick=e=>{e.stopPropagation();pmenu(p)};r.append(th,b,m);r.onclick=()=>openP(p);box.append(r)}}
function pmenu(p){sheet(p.t,[['Ubah nama',async()=>{const n=await ask('Nama proyek',p.t);if(n&&n.trim()){p.t=n.trim();await put('projects',p);renderLib()}}],['Ekspor...',()=>exportMenu(p)],['Hapus proyek',()=>delP(p),1]])}
async function delP(p){if(!await yes(`Hapus "${p.t}" beserta semua babnya? Tindakan ini tidak bisa dibatalkan.`))return;const ids=(await chapsOf(p.id)).map(c=>c.id);await tx(['projects','chapters','texts'],'readwrite',(a,b,c)=>{a.delete(p.id);ids.forEach(i=>{b.delete(i);c.delete(i)});c.delete('n_'+p.id)});if(P&&P.id==p.id){P=C=null}renderLib()}
async function newP(){const t=await ask('Judul proyek baru');if(!t||!t.trim())return;const p={id:uid(),t:t.trim(),u:Date.now(),n:0};await put('projects',p);openP(p)}
async function openP(p){await flush();C=null;P=p;chs=await chapsOf(p.id);if(!chs.length)await addCh();openC(chs.find(c=>c.id==p.last)||chs[0])}

/* ===== Editor ===== */
function setSt(ok,m){const s=$('#st');s.textContent=m||(ok?'● Tersimpan':'● Belum disimpan');s.className=ok?'ok':'no'}
function hdr(){$('#h1').textContent=P.t;$('#h2').textContent=C.t+' ▾'}
async function addCh(){await flush();const c={id:uid(),pid:P.id,o:chs.length?Math.max(...chs.map(x=>x.o))+1:0,t:'Bab '+pad(chs.length+1),w:0};chs.push(c);P.n=chs.length;P.u=Date.now();await tx(['chapters','texts','projects'],'readwrite',(a,b,p)=>{a.put(c);b.put({id:c.id,text:''});p.put(P)});return c}
async function openC(c){await flush();const t=await tx('texts','readonly',s=>s.get(c.id));C=c;$('#ta').value=t?t.text:'';$('#ct').value=c.t;P.last=c.id;put('projects',P);hdr();count();setSt(true);show('ed');$('#ta').scrollTop=0}
async function save(){if(!dirty||!C)return;dirty=false;const x=$('#ta').value;C.t=$('#ct').value.trim()||'Tanpa judul';C.w=stats(x)[0];P.u=Date.now();const c={...C},p={...P};
try{let sn=0;await tx(['chapters','texts','projects','versions'],'readwrite',(a,b,d,v)=>{a.put(c);d.put(p);b.get(c.id).onsuccess=e=>{const o=e.target.result;if(o&&o.text&&o.text!==x&&Date.now()-(c.sn||0)>9e5){sn=Date.now();v.put({id:uid(),cid:c.id,t:sn,text:o.text,w:stats(o.text)[0]});a.put({...c,sn});v.index('cid').getAllKeys(c.id).onsuccess=k=>k.target.result.slice(0,-10).forEach(i=>v.delete(i))}b.put({id:c.id,text:x})}});if(sn)C.sn=sn;hdr();if(!dirty)setSt(true)}catch(e){dirty=true;setSt(false,'● Gagal menyimpan')}}
async function flush(){if(!dirty)return;clearTimeout(timer);await save()}
function touch(){dirty=true;setSt(false);clearTimeout(timer);timer=setTimeout(save,3000);clearTimeout(cnt);cnt=setTimeout(count,250)}

/* ===== Bab ===== */
function renderCh(){const q=$('#cq').value.toLowerCase(),box=$('#clist');box.replaceChildren();$('#ptit').textContent=P.t;$('#pn').textContent=chs.length+' bab';
chs.forEach((c,i)=>{if(!c.t.toLowerCase().includes(q))return;const r=E('div','row crow'+(C&&C.id==c.id?' cur':'')),b=E('div','grow');b.append(E('b','',`${i+1}. ${c.t}`),E('div','mu',fmt(c.w||0)+' kata'));r.append(b);
if(reord){const u=E('button','ib','↑'),d=E('button','ib','↓');u.onclick=()=>mv(i,-1);d.onclick=()=>mv(i,1);r.append(u,d)}
else{const m=E('button','ib','⋮');m.onclick=e=>{e.stopPropagation();cmenu(c)};r.append(m);r.onclick=()=>openC(c)}box.append(r)})}
async function mv(i,d){const j=i+d;if(j<0||j>=chs.length)return;[chs[i],chs[j]]=[chs[j],chs[i]];chs.forEach((c,k)=>c.o=k);const a=chs.map(c=>({...c}));await tx('chapters','readwrite',s=>{a.forEach(c=>{s.put(c)})});renderCh()}
function cmenu(c){sheet(c.t,[['Ubah nama',async()=>{const n=await ask('Judul bab',c.t);if(n&&n.trim()){c.t=n.trim();await put('chapters',{...c});if(C&&C.id==c.id)$('#ct').value=c.t;renderCh()}}],['Ekspor bab (.txt)',()=>expoCh(c)],['Hapus bab',async()=>{if(!await yes(`Hapus "${c.t}"?`))return;chs=chs.filter(x=>x!=c);P.n=chs.length;await tx(['chapters','texts','projects'],'readwrite',(a,b,p)=>{a.delete(c.id);b.delete(c.id);p.put({...P})});if(C&&C.id==c.id){C=null;dirty=false}renderCh()},1]])}

/* ===== Berkas & Cadangan ===== */
async function renderFiles(){const l=(await tx('projects','readonly',s=>s.getAll())).sort((a,b)=>b.u-a.u),box=$('#flist');box.replaceChildren();
for(const p of l){const r=E('div','card row'),b=E('div','grow'),x=E('button','btn sm','Ekspor');b.append(E('b','',p.t),E('div','mu',p.n+' bab'));x.onclick=e=>{e.stopPropagation();exportMenu(p)};r.append(b,x);r.onclick=()=>openP(p);box.append(r)}
if(!l.length)box.append(E('p','mu','Belum ada folder proyek.'));
const ps=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false;$('#pst').textContent=ps?'Penyimpanan permanen: aktif.':'Penyimpanan permanen: belum aktif, browser masih boleh menghapus data saat memori HP penuh.';const sz=b=>b<1048576?Math.round(b/1024)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(1)+' GB',es=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;$('#use').textContent=es?`Penyimpanan terpakai (perkiraan): ${sz(es.usage)} dari kuota ${sz(es.quota)}`:'';const lb=await tx('settings','readonly',s=>s.get('lb'));$('#lb').textContent='Cadangan terakhir: '+(lb?new Date(lb.v).toLocaleString('id-ID'):'Belum pernah')}
async function expo(list){await flush();const fs=[];
for(const p of list){const cs=await chapsOf(p.id),ts=await tx('texts','readonly',s=>cs.map(c=>s.get(c.id)));cs.forEach((c,i)=>fs.push({name:`${safe(p.t)}/${pad(i+1)} - ${safe(c.t)}.txt`,text:ts[i]?ts[i].text:''}));const nt=await tx('texts','readonly',s=>s.get('n_'+p.id));if(nt&&nt.text.trim())fs.push({name:`${safe(p.t)}/_Catatan.txt`,text:nt.text})}
if(!fs.length)return toast('Belum ada bab untuk diekspor');
if(!await dlf((list.length==1?safe(list[0].t):'LocalWriter-cadangan-'+new Date().toISOString().slice(0,10))+'.zip',zip(fs)))return;
await put('settings',{k:'lb',v:Date.now()});toast('ZIP dibuat');if($('#files').classList.contains('on'))renderFiles();if($('#lib').classList.contains('on'))renderLib()}
$('#imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
try{const g={};for(const x of await unzip(await f.arrayBuffer())){if(!/\.txt$/i.test(x.name))continue;const p=x.name.split('/'),fo=p.length>1?p[0]:f.name.replace(/\.zip$/i,'');(g[fo]=g[fo]||[]).push({fn:p[p.length-1],text:x.text})}
const ex=(await tx('projects','readonly',s=>s.getAll())).map(p=>p.t);let n=0;
for(const fo in g){const nn=g[fo].find(x=>x.fn=='_Catatan.txt'),l=g[fo].filter(x=>x.fn!='_Catatan.txt').sort((a,b)=>a.fn.localeCompare(b.fn,undefined,{numeric:true})),p={id:uid(),t:ex.includes(fo)?fo+' (impor)':fo,u:Date.now(),n:l.length},
cs=l.map((x,i)=>({id:uid(),pid:p.id,o:i,t:x.fn.replace(/\.txt$/i,'').replace(/^\d+\s*-\s*/,'')||'Bab '+(i+1),w:stats(x.text)[0]}));
await tx(['projects','chapters','texts'],'readwrite',(a,b,c)=>{a.put(p);if(nn)c.put({id:'n_'+p.id,text:nn.text});cs.forEach((ch,i)=>{b.put(ch);c.put({id:ch.id,text:l[i].text})})});n++}
toast(n?n+' proyek diimpor':'Tidak ada file .txt di ZIP');renderFiles()}catch(err){toast('File ZIP tidak valid')}};

/* ===== Pengaturan teks ===== */
function applyCfg(){const r=document.documentElement;r.style.setProperty('--ff',FF[cfg.ff]);r.style.setProperty('--fs',cfg.fs+'px');r.style.setProperty('--lh',cfg.lh);$('#ta').style.textAlign=cfg.al;
r.dataset.t=cfg.th=='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):cfg.th;
$('#sf').value=cfg.ff;$('#ss').value=cfg.fs;$('#sl').value=cfg.lh;$('#slv').textContent=cfg.lh;
$$('[data-a]').forEach(b=>b.classList.toggle('a',b.dataset.a==cfg.al));$$('[data-th]').forEach(b=>b.classList.toggle('a',b.dataset.th==cfg.th))}
const setCfg=(k,v)=>{cfg[k]=v;applyCfg();put('settings',{k:'cfg',v:cfg})};
[14,16,18,20,22,24,26].forEach(n=>$('#ss').append(new Option(n+' pt',n)));

/* ===== Unduh, ekspor teks ===== */
async function dlf(name,data){const dl=window.claude&&claude.use?await claude.use('downloads'):null;
if(dl){try{await dl.save({filename:name,data});return 1}catch(e){toast(e.code=='declined'?'Ekspor dibatalkan':'Gagal mengekspor');return 0}}
const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6e4);return 1}
function exportMenu(p){sheet('Ekspor '+p.t,[['ZIP (satu file per bab)',()=>expo([p])],['Satu file .txt (seluruh novel)',()=>expoTxt(p)]])}
async function expoTxt(p){await flush();const cs=await chapsOf(p.id);if(!cs.length)return toast('Belum ada bab untuk diekspor');const ts=await tx('texts','readonly',s=>cs.map(c=>s.get(c.id)));
await dlf(safe(p.t)+'.txt',p.t+'\n\n'+cs.map((c,i)=>`${c.t}\n\n${ts[i]?ts[i].text:''}`).join('\n\n\n'))}
async function expoCh(c){await flush();const t=await tx('texts','readonly',s=>s.get(c.id));await dlf(safe(c.t)+'.txt',c.t+'\n\n'+(t?t.text:''))}

/* ===== Pengingat backup ===== */
async function remind(){const rm=$('#rm'),lb=await tx('settings','readonly',s=>s.get('lb')),d=lb?(Date.now()-lb.v)/864e5:99,w=(await tx('chapters','readonly',s=>s.getAll())).reduce((a,c)=>a+(c.w||0),0);
if(rmHide||w<1||d<7){rm.style.display='none';return}
const r=E('div','row'),a=E('button','btn pri sm','Ekspor semua'),n=E('button','btn sm','Nanti');r.style.marginTop='10px';
a.onclick=async()=>expo(await tx('projects','readonly',s=>s.getAll()));n.onclick=()=>{rmHide=true;rm.style.display='none'};r.append(a,n);
rm.replaceChildren(E('b','',lb?`Terakhir backup ${Math.floor(d)} hari lalu`:'Belum pernah backup'),E('div','mu','Ekspor ZIP supaya tulisanmu aman dari penghapusan data browser.'),r);rm.style.display='block'}

const snap=x=>put('versions',{id:uid(),cid:C.id,t:Date.now(),text:x,w:stats(x)[0]});
async function snapNow(){await flush();const x=$('#ta').value;if(!x.trim())return toast('Bab masih kosong');await snap(x);C.sn=Date.now();put('chapters',{...C});toast('Versi disimpan')}
const dt=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function hist(){if(!C)return;await flush();const l=(await tx('versions','readonly',s=>s.index('cid').getAll(C.id))).sort((a,b)=>b.t-a.t);
sheet('Riwayat versi',[['Simpan versi sekarang',snapNow],...l.map(v=>[`${dt(v.t)} • ${fmt(v.w)} kata`,()=>restore(v)])])}

/* ===== Cari & ganti ===== */
const rx=(f,cs)=>new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),cs?'g':'gi');
async function frun(rep){await flush();const f=$('#ff').value,out=$('#frr');if(!f){out.textContent='Isi kata yang dicari.';return}
const re=rx(f,$('#fc').checked),ts=await tx('texts','readonly',s=>chs.map(c=>s.get(c.id))),hit=[];let tot=0;
ts.forEach((t,i)=>{const n=t?(t.text.match(re)||[]).length:0;if(n){hit.push([i,n,t.text]);tot+=n}});
if(!hit.length){out.textContent='Tidak ditemukan.';return}
out.textContent=`${fmt(tot)} hasil di ${hit.length} bab:\n`+hit.map(h=>`• ${chs[h[0]].t} (${h[1]})`).join('\n');
if(!rep)return;const r=$('#fp').value;
if(!await yes(`Ganti ${fmt(tot)} kemunculan di ${hit.length} bab? Versi lama tiap bab disimpan di riwayat.`,'Ganti'))return;
const nt=hit.map(h=>h[2].replace(re,()=>r));
await tx(['texts','chapters','versions'],'readwrite',(t,a,v)=>{hit.forEach((h,k)=>{const c=chs[h[0]];c.w=stats(nt[k])[0];v.put({id:uid()+k,cid:c.id,t:Date.now(),text:h[2],w:stats(h[2])[0]});t.put({id:c.id,text:nt[k]});a.put({...c})})});
hit.forEach((h,k)=>{if(C&&chs[h[0]].id==C.id){$('#ta').value=nt[k];count()}});
out.textContent=`Selesai: ${fmt(tot)} diganti di ${hit.length} bab.`;renderCh()}
